name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    concurrency:
      group: release-create-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "rDM") | .version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version $version." >&2
            exit 1
          fi

      - name: Create GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "rDM $RELEASE_TAG" --notes-file CHANGELOG.md --latest

  windows:
    needs: release
    uses: ./.github/workflows/windows.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_ref: ${{ github.sha }}

  linux:
    needs: release
    uses: ./.github/workflows/linux.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_ref: ${{ github.sha }}

  extensions:
    needs: release
    uses: ./.github/workflows/extensions.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_ref: ${{ github.sha }}
