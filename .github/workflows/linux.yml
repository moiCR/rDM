name: Linux

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update
        required: true
        type: string
      source_ref:
        description: Git ref to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string
      source_ref:
        description: Git ref to build (defaults to the release tag)
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-24.04
    concurrency:
      group: release-linux-${{ inputs.release_tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.release_tag) }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Validate release target
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "rDM") | .version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version $version." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake dbus-daemon desktop-file-utils dpkg-dev imagemagick pkg-config rpm \
            libasound2-dev libfontconfig-dev libglib2.0-dev libglib2.0-bin \
            libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Validate Linux implementation
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Build release binaries
        run: cargo build --release --locked --workspace

      - name: Stage Linux binaries and desktop assets
        run: |
          root=target/linux-package
          install -Dm755 target/release/rDM "$root/usr/lib/rdm/rdm"
          install -Dm755 target/release/rdm-cli "$root/usr/lib/rdm/rdm-cli"
          cp -a crates/app/public "$root/usr/lib/rdm/public"

          mkdir -p "$root/usr/bin" "$root/usr/share/applications" dist
          ln -s ../lib/rdm/rdm "$root/usr/bin/rdm"
          ln -s ../lib/rdm/rdm-cli "$root/usr/bin/rdm-cli"
          icon_dir="$root/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$icon_dir"
          convert icon.png -resize 256x256 "$icon_dir/rdm.png"
          cat > "$root/usr/share/applications/rdm.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=rDM
          Comment=Internet download manager
          Exec=rdm
          Icon=rdm
          Categories=Network;FileTransfer;
          Terminal=false
          EOF
          desktop-file-validate "$root/usr/share/applications/rdm.desktop"

      - name: Package Debian installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          root="$PWD/target/linux-package"
          mkdir -p target/debian-packaging/debian "$root/DEBIAN"
          cat > target/debian-packaging/debian/control <<'EOF'
          Source: rdm

          Package: rdm
          Architecture: amd64
          EOF
          dependencies="$(cd target/debian-packaging &&
            dpkg-shlibdeps -O "$root/usr/lib/rdm/rdm" "$root/usr/lib/rdm/rdm-cli")"
          dependencies="${dependencies#shlibs:Depends=}"
          test -n "$dependencies"
          deb_version="${VERSION/-/\~}"
          cat > "$root/DEBIAN/control" <<EOF
          Package: rdm
          Version: $deb_version
          Architecture: amd64
          Maintainer: moiCR
          Depends: $dependencies, xdg-utils
          Recommends: libvulkan1
          Homepage: https://github.com/moiCR/rDM
          Description: Internet download manager
          EOF
          printf 'deb\n' > "$root/usr/lib/rdm/package-format"
          dpkg-deb --root-owner-group --build "$root" "dist/rdm_${VERSION}_amd64.deb"

      - name: Package RPM installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rpm_version="${VERSION/-/\~}"
          rpm_version="${rpm_version//-/_}"
          cat > target/rdm.spec <<EOF
          Name: rdm
          Version: $rpm_version
          Release: 1
          Summary: Internet download manager
          License: Unspecified
          URL: https://github.com/moiCR/rDM
          BuildArch: x86_64
          Requires: xdg-utils

          %description
          rDM desktop application and command-line client.

          %install
          mkdir -p "%{buildroot}"
          cp -a "$PWD/target/linux-package/usr" "%{buildroot}/"

          %files
          /usr/bin/rdm
          /usr/bin/rdm-cli
          /usr/lib/rdm
          /usr/share/applications/rdm.desktop
          /usr/share/icons/hicolor/256x256/apps/rdm.png
          EOF
          printf 'rpm\n' > target/linux-package/usr/lib/rdm/package-format
          rpmbuild -bb --define "_topdir $PWD/target/rpm" target/rdm.spec
          cp "target/rpm/RPMS/x86_64/rdm-${rpm_version}-1.x86_64.rpm" \
            "dist/rdm-${VERSION}-1.x86_64.rpm"

      - name: Package AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          root=target/linux-package
          appdir=target/rDM.AppDir
          mkdir -p "$appdir/usr/bin"
          cp -a "$root/usr/lib/rdm/public" "$appdir/usr/bin/public"

          curl --fail --silent --show-error --location \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output target/linuxdeploy.AppImage
          curl --fail --silent --show-error --location \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output target/appimagetool.AppImage
          sha256sum --check <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  target/linuxdeploy.AppImage
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  target/appimagetool.AppImage
          EOF
          chmod +x target/linuxdeploy.AppImage target/appimagetool.AppImage
          target/linuxdeploy.AppImage --appdir "$appdir" \
            --executable "$root/usr/lib/rdm/rdm" \
            --executable "$root/usr/lib/rdm/rdm-cli" \
            --desktop-file "$root/usr/share/applications/rdm.desktop" \
            --icon-file "$root/usr/share/icons/hicolor/256x256/apps/rdm.png"

          notices="$appdir/usr/bin/public/appimage-notices"
          mkdir -p "$notices"
          while IFS= read -r library; do
            packages="$(dpkg-query --search "*/$library" 2>/dev/null |
              sed -E 's/: .*//; s/, /\n/g' | sort -u || true)"
            if [[ -z "$packages" ]]; then
              echo "::warning::No Ubuntu package matched the bundled library $library"
              continue
            fi
            while IFS= read -r package; do
              package="${package%%:*}"
              copyright="/usr/share/doc/$package/copyright"
              if [[ ! -r "$copyright" ]]; then
                echo "::warning::No copyright file found for $package"
                continue
              fi
              install -Dm644 "$copyright" "$notices/$package.txt"
              while IFS= read -r license; do
                if [[ -r "$license" ]]; then
                  install -Dm644 "$license" "$notices/common-licenses/${license##*/}"
                fi
              done < <(grep -oE '/usr/share/common-licenses/[[:alnum:].+-]+' "$copyright" | sort -u)
            done <<< "$packages"
          done < <(find "$appdir/usr" -type f -name '*.so*' -printf '%f\n' | sort -u)

          target/appimagetool.AppImage --no-appstream "$appdir" "dist/rDM-${VERSION}-x86_64.AppImage"

      - name: Replace Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/rDM-${VERSION}-x86_64.AppImage" \
            "dist/rdm_${VERSION}_amd64.deb" \
            "dist/rdm-${VERSION}-1.x86_64.rpm" \
            --repo "$GITHUB_REPOSITORY" --clobber
