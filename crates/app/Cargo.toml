[package]
name = "rDM"
version.workspace = true
edition.workspace = true


[[bin]]
name = "rDM"
path = "src/main.rs"

[dependencies]
gpui-pre = "0.3.11"
gpui-kit = "0.9.0"
gpui-router = { version = "0.7", default-features = false, features = ["gpui-pre"] }
tokio.workspace = true
rdm-core.workspace = true
rdm-config.workspace = true
uuid.workspace = true
anyhow = { workspace = true }
smallvec = "1.16.4"
chrono = "0.4.45"
toml = "0.8"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.3"
rustix = { version = "1", features = ["process", "fs"] }
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

